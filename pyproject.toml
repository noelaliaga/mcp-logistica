[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-logistica"
version = "0.1.0"
description = "MCP server that lets an AI agent query and operate a warehouse management system (WMS) with restricted writes and a database-level audit trail."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Noel Aliaga" }]
requires-python = ">=3.11"
# mcp is capped at the minor version the test suite has run against: server.py
# touches a FastMCP internal (see docs/decisions.md, decision 1). Widen the cap
# after tests/test_protocol_stdio.py passes on the next minor.
dependencies = [
    "mcp>=1.30,<1.31",
]

[project.optional-dependencies]
# Upper bounds keep a new lint rule or type-checker release from turning CI red
# without a code change. Verified with ruff 0.16.7, mypy 2.3.1, pytest 9.1.1.
dev = [
    "mypy>=2.3,<2.4",
    "pytest>=9.1,<10",
    "ruff>=0.16.7,<0.17",
]

[project.scripts]
wms-mcp = "wms_mcp.server:main"
wms-seed = "wms_mcp.seed:main"
wms-report = "wms_mcp.calllog:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wms_mcp = ["schema.sql", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "RET"]
ignore = [
    "S101",  # asserts are fine in tests
    "S608",  # SQL is built only from allowlisted column names; see service.py
]

[tool.ruff.lint.isort]
known-first-party = ["wms_mcp", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
